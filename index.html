<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Pre-paint theme init — prevents flash of wrong theme on reload
        (function(){
            try {
                var t = localStorage.getItem('rx-theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <title>Procurement Management System — Salak Unit 7</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f766e'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='none' stroke='%2314b8a6' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Leaflet (for COO Map tab) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; color: #e2e8f0; }
        .header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(51, 65, 85, 0.5); position: sticky; top: 0; z-index: 500; padding: 1rem 1.5rem; }
        .header-content { max-width: 1800px; margin: 0 auto; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .logo-section { display: flex; align-items: center; gap: 1rem; }
        .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #14b8a6, #06b6d4); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3); }
        .logo-icon svg { width: 24px; height: 24px; color: white; }
        .logo-text h1 { font-size: 1.25rem; font-weight: 700; color: white; }
        .logo-text p { font-size: 0.75rem; color: #94a3b8; }
        .header-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .project-select { appearance: none; background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 0.5rem 1rem; color: white; font-size: 0.875rem; cursor: pointer; }
        .project-select:focus { outline: none; border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2); }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1.25rem; border-radius: 12px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #0d9488, #06b6d4); color: white; box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3); }
        .btn-primary:hover { background: linear-gradient(135deg, #14b8a6, #22d3ee); }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }
        .btn-icon { padding: 0.5rem; border-radius: 8px; background: transparent; color: #94a3b8; border: none; cursor: pointer; }
        .btn-icon:hover { background: #334155; color: white; }
        .nav-tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .nav-tab { display: flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1rem; border-radius: 12px; font-size: 0.875rem; font-weight: 500; color: #94a3b8; background: transparent; border: none; cursor: pointer; transition: all 0.3s; }
        .nav-tab:hover { background: #1e293b; color: white; }
        .nav-tab.active { background: linear-gradient(135deg, rgba(13, 148, 136, 0.2), rgba(6, 182, 212, 0.2)); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.3); }
        .nav-tab svg { width: 18px; height: 18px; }
        .main-content { max-width: 1800px; margin: 0 auto; padding: 1.5rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: linear-gradient(135deg, #1e293b, rgba(30, 41, 59, 0.5)); border-radius: 16px; padding: 1.25rem; border: 1px solid rgba(51, 65, 85, 0.5); }
        .stat-card-content { display: flex; justify-content: space-between; align-items: center; }
        .stat-label { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .stat-value { font-size: 2rem; font-weight: 700; color: white; }
        .stat-note { font-size: 0.7rem; color: #64748b; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid rgba(51,65,85,0.4); line-height: 1.3; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .stat-icon.blue { background: rgba(59, 130, 246, 0.2); }
        .stat-icon.blue svg { color: #60a5fa; }
        .stat-icon.emerald { background: rgba(16, 185, 129, 0.2); }
        .stat-icon.emerald svg { color: #34d399; }
        .stat-icon.red { background: rgba(239, 68, 68, 0.2); }
        .stat-icon.red svg { color: #f87171; }
        .stat-icon.teal { background: rgba(20, 184, 166, 0.2); }
        .stat-icon.teal svg { color: #2dd4bf; }
        .stat-icon svg { width: 24px; height: 24px; }
    </style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <div class="header-top">
      <div class="logo-section">
        <div class="logo-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Procurement Management System</h1>
          <p>Geothermal Gunung Salak Unit 7</p>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>
      <a href="PR_SR.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        PR / SR Monitoring
      </a>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="tab-content active" id="tab-overview">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-content">
          <div>
            <div class="stat-label">Welcome</div>
            <div class="stat-value">Dashboard</div>
          </div>
          <div class="stat-icon teal">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2 1m2-1l-2-1m2 1v2.5"/>
            </svg>
          </div>
        </div>
        <div class="stat-note">Navigate to PR / SR Monitoring for detailed tracking</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Add active class management for navigation
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', function(e) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
    });
  });
  
  // Auto-detect current page and set active tab
  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-tab').forEach(tab => {
    const href = tab.getAttribute('href');
    if (href === currentPage || (currentPage === '' && href === 'index.html')) {
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });
</script>

</body>
</html>
